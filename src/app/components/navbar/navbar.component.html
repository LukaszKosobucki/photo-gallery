<mat-toolbar class="navbar-toolbar">
  <mat-button-toggle-group
    [value]="currentTab()"
    (change)="navigateTo($event.value)"
    hideSingleSelectionIndicator
    class="nav-toggle-group"
    aria-label="Navigation"
  >
    <mat-button-toggle
      value="photos"
      class="nav-toggle-item"
      data-testid="nav-photos-tab"
      (click)="navigateTo('photos')"
    >
      Photos
    </mat-button-toggle>
    <mat-button-toggle
      value="favorites"
      class="nav-toggle-item"
      data-testid="nav-favorites-tab"
      (click)="navigateTo('favorites')"
    >
      Favorites <span class="favorites-badge" data-testid="favorites-badge">{{ favoritesCount() }}</span>
    </mat-button-toggle>
  </mat-button-toggle-group>
</mat-toolbar>
